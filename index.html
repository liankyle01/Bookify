<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookify — Log In</title>
<link rel="stylesheet" href="d.css">
</head>
<body>

<div class="auth-page">
  <img class="auth-logo" src="lg_no_bg.png" alt="Bookify">
  <div class="auth-container">
    <div class="auth-illustration">
      <img class="auth-books-img" src="bookstack.jpg" alt="Books">
    </div>
    <div class="auth-form-panel">
      <div class="auth-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="auth-heading">Welcome, Kify Users!</div>  
      <div id="loginButtons">
        <button class="auth-btn" onclick="showLoginForm()">Log in</button>
        <div class="auth-or">OR</div>
        <button class="auth-btn-secondary" onclick="showSignUpForm()">Sign Up</button>
      </div>
      <div id="loginForm" class="hidden">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" placeholder="Username" id="loginUsername">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" placeholder="Password" id="loginPassword">
        </div>
        <div class="auth-link" onclick="alert('Password reset link sent to your email.')">Forgot Password?</div>
        <button class="auth-btn" onclick="login()">Log in</button>
        <div class="auth-back" onclick="backToLoginButtons()">Back</div>
      </div>
      <div id="signUpForm" class="hidden">
        <div class="auth-field">
          <label>Full Name</label>
          <input type="text" placeholder="Full Name" id="signupName">
        </div>
        <div class="auth-field">
          <label>Username</label>
          <input type="text" placeholder="Choose a username" id="signupUsername">
        </div>
        <div class="auth-field">
          <label>Student / Employee ID</label>
          <input type="text" placeholder="ID Number" id="signupId">
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" placeholder="Email Address" id="signupEmail">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" placeholder="Password" id="signupPassword">
        </div>
        <div class="auth-field">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm Password" id="signupConfirm">
        </div>
        <div class="auth-field">
          <label>I am a...</label>
          <div class="auth-roles">
            <button type="button" class="role-btn" onclick="selectRole(this, 'student')">🎓 Student</button>
            <button type="button" class="role-btn" onclick="selectRole(this, 'faculty')">👨‍🏫 Faculty</button>
            <button type="button" class="role-btn" onclick="selectRole(this, 'librarian')">📚 Librarian</button>
          </div>
        </div>
        <button class="auth-btn" onclick="signup()">Sign Up</button>
        <div class="auth-back" onclick="backToLoginButtons()">Already have an account? Log in</div>
      </div>
    </div>
  </div>
</div>

<script src="j.js"></script>
</body>
</html>
